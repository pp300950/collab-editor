<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CollabPy — Collaborative Python Editor</title>

<!-- CodeMirror 5 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/comment/comment.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600&display=swap');

  :root {
    --bg:        #0d0f14;
    --surface:   #151820;
    --surface2:  #1c2030;
    --border:    #2a2f42;
    --accent:    #7c6bff;
    --accent2:   #4ecdc4;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --success:   #4ade80;
    --error:     #f87171;
    --warning:   #fbbf24;
    --run-btn:   #22c55e;
    --radius:    10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TOPBAR ── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    color: var(--accent);
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logo span { color: var(--accent2); }

  .topbar-mid { flex: 1; display: flex; align-items: center; gap: 12px; }

  .users-bar {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .user-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px 4px 6px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid transparent;
    transition: all 0.2s;
    background: var(--surface2);
  }
  .user-pill .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .user-pill.active { opacity: 1; }
  .user-pill.inactive { opacity: 0.4; }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 6px var(--success);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .topbar-right { display: flex; align-items: center; gap: 10px; }

  .name-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    width: 130px;
    outline: none;
    transition: border-color 0.2s;
  }
  .name-input:focus { border-color: var(--accent); }

  .btn-run {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 18px;
    background: var(--run-btn);
    color: #000;
    border: none;
    border-radius: 7px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-run:hover { background: #4ade80; transform: translateY(-1px); }
  .btn-run:active { transform: translateY(0); }
  .btn-run:disabled { background: var(--muted); cursor: not-allowed; transform: none; }
  .btn-run svg { width: 14px; height: 14px; }

  .conn-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
  }
  .conn-badge.connected { background: rgba(74,222,128,0.15); color: var(--success); }
  .conn-badge.disconnected { background: rgba(248,113,113,0.15); color: var(--error); }

  /* ── MAIN LAYOUT ── */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── EDITOR PANE ── */
  .editor-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  .pane-header {
    padding: 8px 16px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .pane-header .file-icon { color: var(--warning); }

  .cm-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .CodeMirror {
    font-family: 'JetBrains Mono', monospace !important;
    font-size: 14px !important;
    line-height: 1.7 !important;
    height: 100% !important;
    background: #1a1e2e !important;
  }
  .CodeMirror-scroll { padding-bottom: 40px; }
  .CodeMirror-gutters { background: #141824 !important; border-right: 1px solid var(--border) !important; }
  .CodeMirror-linenumber { color: #3a4060 !important; }
  .CodeMirror-activeline-background { background: rgba(124,107,255,0.06) !important; }
  .CodeMirror-cursor { border-left: 2px solid #fff !important; }
  .CodeMirror-selected { background: rgba(124,107,255,0.25) !important; }

  /* Remote cursors */
  .remote-cursor {
    position: absolute;
    width: 2px;
    border-radius: 1px;
    pointer-events: none;
    z-index: 10;
  }
  .remote-cursor-label {
    position: absolute;
    top: -20px;
    left: 0;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 6px;
    border-radius: 3px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 11;
    font-weight: 600;
  }
  .remote-selection {
    opacity: 0.2;
    border-radius: 2px;
  }

  /* ── OUTPUT PANE ── */
  .output-pane {
    width: 360px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    overflow: hidden;
  }

  .output-header {
    padding: 8px 16px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .output-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .output-tab {
    padding: 8px 16px;
    font-size: 12px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    transition: all 0.2s;
    font-weight: 500;
  }
  .output-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .output-tab:hover:not(.active) { color: var(--text); }

  .output-content {
    flex: 1;
    overflow: auto;
    padding: 14px;
  }

  .output-box {
    display: none;
  }
  .output-box.active { display: block; }

  .output-pre {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .output-pre.stdout { color: var(--success); }
  .output-pre.stderr { color: var(--error); }
  .output-pre.empty  { color: var(--muted); font-style: italic; }

  .run-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    font-size: 11px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    min-height: 34px;
  }
  .spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }
  .spinner.active { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .exit-badge {
    margin-left: auto;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
  }
  .exit-badge.ok { background: rgba(74,222,128,0.15); color: var(--success); }
  .exit-badge.err { background: rgba(248,113,113,0.15); color: var(--error); }

  /* ── LOG ── */
  .log-entry {
    display: flex;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    align-items: flex-start;
  }
  .log-entry:last-child { border-bottom: none; }
  .log-time { color: var(--muted); flex-shrink: 0; font-size: 10px; padding-top: 2px; }
  .log-msg { flex: 1; line-height: 1.5; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    z-index: 999;
    animation: fadeIn 0.2s ease;
    pointer-events: none;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- ── TOPBAR ── -->
<div class="topbar">
  <div class="logo">⟨/<span>CollabPy</span>⟩</div>

  <div class="topbar-mid">
    <div class="status-dot" id="statusDot" title="WebSocket"></div>
    <div class="users-bar" id="usersBar"></div>
  </div>

  <div class="topbar-right">
    <span class="conn-badge disconnected" id="connBadge">ออฟไลน์</span>
    <input class="name-input" id="nameInput" placeholder="ชื่อของคุณ" maxlength="20">
    <button class="btn-run" id="runBtn">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 2l11 6-11 6V2z"/></svg>
      รันโค้ด
    </button>
  </div>
</div>

<!-- ── MAIN ── -->
<div class="main">

  <!-- Editor -->
  <div class="editor-pane">
    <div class="pane-header">
      <span class="file-icon">●</span>
      <span>main.py</span>
    </div>
    <div class="cm-wrap">
      <textarea id="editor"></textarea>
    </div>
  </div>

  <!-- Output -->
  <div class="output-pane">
    <div class="output-tabs">
      <div class="output-tab active" data-tab="stdout">stdout</div>
      <div class="output-tab" data-tab="stderr">stderr</div>
      <div class="output-tab" data-tab="log">log</div>
    </div>
    <div class="output-content">
      <div class="output-box active" id="box-stdout">
        <pre class="output-pre empty" id="pre-stdout">// กดรันโค้ดเพื่อดูผลลัพธ์...</pre>
      </div>
      <div class="output-box" id="box-stderr">
        <pre class="output-pre empty" id="pre-stderr">// ไม่มี error</pre>
      </div>
      <div class="output-box" id="box-log">
        <div id="logList"></div>
      </div>
    </div>
    <div class="run-indicator">
      <div class="spinner" id="spinner"></div>
      <span id="runStatus">พร้อมรัน</span>
      <span class="exit-badge" id="exitBadge" style="display:none"></span>
    </div>
  </div>

</div>

<script>
// ─────────────────────────────────────────────────────────────
//  CONFIG — เปลี่ยน WS_URL ให้ตรงกับ Render URL ของคุณ
// ─────────────────────────────────────────────────────────────
const WS_BASE = (() => {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  return `${proto}://${location.host}`;
})();

// ─────────────────────────────────────────────────────────────
//  CodeMirror Setup
// ─────────────────────────────────────────────────────────────
const cm = CodeMirror.fromTextArea(document.getElementById('editor'), {
  mode: 'python',
  theme: 'dracula',
  lineNumbers: true,
  tabSize: 4,
  indentWithTabs: false,
  autoCloseBrackets: true,
  matchBrackets: true,
  styleActiveLine: true,
  lineWrapping: false,
  extraKeys: {
    'Tab': (cm) => cm.replaceSelection('    '),
    'Ctrl-/': 'toggleComment',
    'Cmd-/': 'toggleComment',
    'Ctrl-Enter': () => runCode(),
    'Cmd-Enter': () => runCode(),
  }
});

// ─────────────────────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────────────────────
let ws = null;
let myUserId = 'user_' + Math.random().toString(36).slice(2, 7);
let myColor = '#ffffff';
let remoteCursors = {};   // uid -> bookmark widget
let remoteMarkers = {};   // uid -> TextMarker (selection)
let suppressChange = false;
let isRunning = false;
let reconnectTimer = null;
let lastSentCode = null;  // ✅ FIX: track what WE sent so we ignore our own echo

// ─────────────────────────────────────────────────────────────
//  Name input
// ─────────────────────────────────────────────────────────────
const nameInput = document.getElementById('nameInput');
nameInput.value = localStorage.getItem('collabpy_name') || '';

// ✅ FIX: reconnect เฉพาะตอน blur หรือกด Enter เท่านั้น ไม่ reconnect ทุก keystroke
nameInput.addEventListener('input', () => {
  localStorage.setItem('collabpy_name', nameInput.value.trim());
});
nameInput.addEventListener('blur', () => {
  const newId = nameInput.value.trim() || myUserId;
  if (newId !== getMyId()) { myUserId = newId; reconnect(); }
});
nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { nameInput.blur(); }
});

// ─────────────────────────────────────────────────────────────
//  WebSocket
// ─────────────────────────────────────────────────────────────
let intentionalClose = false;  // ✅ FIX: flag to skip auto-reconnect on manual close

function connect() {
  if (ws) {
    intentionalClose = true;
    ws.close();
  }
  intentionalClose = false;
  const uid = encodeURIComponent(nameInput.value.trim() || myUserId);
  ws = new WebSocket(`${WS_BASE}/ws/${uid}`);

  ws.onopen = () => {
    setConnected(true);
    addLog('🔌 เชื่อมต่อสำเร็จ', '#4ade80');
  };

  ws.onclose = () => {
    setConnected(false);
    if (intentionalClose) return;  // ✅ FIX: don't auto-reconnect if we closed on purpose
    addLog('❌ หลุดการเชื่อมต่อ — กำลังเชื่อมต่อใหม่...', '#f87171');
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 3000);
  };

  ws.onerror = () => {
    addLog('⚠️ WebSocket error', '#fbbf24');
  };

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    handleMessage(msg);
  };
}

function reconnect() {
  clearTimeout(reconnectTimer);
  intentionalClose = true;  // ✅ prevent the onclose handler from queueing another reconnect
  if (ws) ws.close();
  setTimeout(connect, 100);  // small delay to let close settle
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

// ─────────────────────────────────────────────────────────────
//  Message Handler
// ─────────────────────────────────────────────────────────────
function handleMessage(msg) {
  switch (msg.type) {

    case 'init':
      myColor = msg.your_color;
      suppressChange = true;
      cm.setValue(msg.code);
      lastSentCode = msg.code;
      suppressChange = false;
      renderAllCursors(msg.cursors, msg.user_id);
      addLog('📄 โหลดโค้ดปัจจุบันแล้ว', '#64748b');
      break;

    case 'code_change':
      // ✅ FIX: skip if it's our own code echoed back (server broadcasts to all including sender via from field check)
      if (msg.code === lastSentCode) break;
      if (msg.from !== getMyId()) {
        applyRemoteCode(msg.code);
      }
      break;

    case 'cursor_update':
      updateRemoteCursor(msg.user_id, msg.line, msg.ch, msg.color, msg.name);
      updateUserPill(msg.user_id, msg.color, msg.name);
      break;

    case 'selection':
      updateRemoteSelection(msg.user_id, msg.from, msg.to, msg.color);
      break;

    case 'user_joined':
      addLog(`👤 ${msg.name} เข้าร่วม`, msg.color);
      updateUserPill(msg.user_id, msg.color, msg.name);
      renderAllCursors(msg.cursors, getMyId());
      break;

    case 'user_left':
      addLog(`👋 ${msg.user_id} ออกจากห้อง`, '#64748b');
      removeRemoteCursor(msg.user_id);
      removeUserPill(msg.user_id);
      renderAllCursors(msg.cursors, getMyId());
      break;

    case 'run_start':
      isRunning = true;
      setRunning(true, msg.user_id);
      break;

    case 'run_result':
      isRunning = false;
      setRunning(false, msg.user_id);
      showOutput(msg.stdout, msg.stderr, msg.exit_code);
      break;
  }
}

function getMyId() {
  return nameInput.value.trim() || myUserId;
}

// ─────────────────────────────────────────────────────────────
//  Code Change
// ─────────────────────────────────────────────────────────────
cm.on('change', (_, change) => {
  if (suppressChange) return;
  const code = cm.getValue();
  lastSentCode = code;  // ✅ FIX: remember what we sent
  send({ type: 'code_change', code });
});

// ✅ FIX: smart apply — preserves cursor position & scroll
function applyRemoteCode(newCode) {
  const cur    = cm.getCursor();
  const scroll = cm.getScrollInfo();

  suppressChange = true;

  // Try to do a minimal diff: replace only the full content
  // but restore cursor and scroll after
  cm.operation(() => {
    const oldCode = cm.getValue();
    if (oldCode === newCode) return;

    // Replace all content but keep cursor sane
    cm.setValue(newCode);

    // Restore cursor (clamp to new doc bounds)
    const lastLine = cm.lastLine();
    const safeL    = Math.min(cur.line, lastLine);
    const safeC    = Math.min(cur.ch, cm.getLine(safeL)?.length ?? 0);
    cm.setCursor({ line: safeL, ch: safeC });
    cm.scrollTo(scroll.left, scroll.top);
  });

  suppressChange = false;
  lastSentCode = newCode;
}

// ─────────────────────────────────────────────────────────────
//  Cursor & Selection Sync
// ─────────────────────────────────────────────────────────────
cm.on('cursorActivity', () => {
  const cur = cm.getCursor();
  send({ type: 'cursor_move', line: cur.line, ch: cur.ch });

  const sel = cm.listSelections()[0];
  if (sel && !posEq(sel.anchor, sel.head)) {
    const from = posMin(sel.anchor, sel.head);
    const to   = posMax(sel.anchor, sel.head);
    send({ type: 'selection', from, to });
  }
});

function posEq(a, b) { return a.line === b.line && a.ch === b.ch; }
function posMin(a, b) { return (a.line < b.line || (a.line === b.line && a.ch <= b.ch)) ? a : b; }
function posMax(a, b) { return posMin(a, b) === a ? b : a; }

// ─────────────────────────────────────────────────────────────
//  Remote Cursor Rendering
// ─────────────────────────────────────────────────────────────
function updateRemoteCursor(uid, line, ch, color, name) {
  if (uid === getMyId()) return;

  // Remove old
  if (remoteCursors[uid]) {
    remoteCursors[uid].clear();
  }

  // Create cursor element
  const cursorEl = document.createElement('div');
  cursorEl.style.cssText = `
    display: inline-block;
    width: 2px;
    height: 1.4em;
    background: ${color};
    position: relative;
    vertical-align: text-bottom;
    margin-left: -1px;
  `;

  const labelEl = document.createElement('div');
  labelEl.textContent = name;
  labelEl.style.cssText = `
    position: absolute;
    top: -20px;
    left: 0;
    background: ${color};
    color: #000;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 99;
  `;
  cursorEl.appendChild(labelEl);

  const docLine = Math.min(line, cm.lastLine());
  const lineLen = cm.getLine(docLine)?.length ?? 0;
  const safeCh  = Math.min(ch, lineLen);

  const widget = cm.setBookmark(
    { line: docLine, ch: safeCh },
    { widget: cursorEl, insertLeft: true }
  );

  remoteCursors[uid] = widget;
}

function removeRemoteCursor(uid) {
  if (remoteCursors[uid]) {
    remoteCursors[uid].clear();
    delete remoteCursors[uid];
  }
  if (remoteMarkers[uid]) {
    remoteMarkers[uid].clear();
    delete remoteMarkers[uid];
  }
}

function renderAllCursors(cursors, myId) {
  Object.entries(cursors).forEach(([uid, c]) => {
    if (uid !== myId) {
      updateRemoteCursor(uid, c.line, c.ch, c.color, c.name);
      updateUserPill(uid, c.color, c.name);
    }
  });
}

function updateRemoteSelection(uid, from, to, color) {
  if (uid === getMyId()) return;
  if (remoteMarkers[uid]) remoteMarkers[uid].clear();

  try {
    const marker = cm.markText(from, to, {
      css: `background: ${color}33; border-radius: 2px;`,
      inclusiveLeft: false,
      inclusiveRight: false,
    });
    remoteMarkers[uid] = marker;
    setTimeout(() => {
      try { marker.clear(); } catch(e) {}
    }, 3000);
  } catch(e) {}
}

// ─────────────────────────────────────────────────────────────
//  Users Bar
// ─────────────────────────────────────────────────────────────
function updateUserPill(uid, color, name) {
  const bar = document.getElementById('usersBar');
  let pill = document.getElementById('pill_' + CSS.escape(uid));
  if (!pill) {
    pill = document.createElement('div');
    pill.id = 'pill_' + uid;
    pill.className = 'user-pill active';
    bar.appendChild(pill);
  }
  pill.innerHTML = `<span class="dot" style="background:${color}"></span>${name}`;
  pill.style.borderColor = color + '44';
}

function removeUserPill(uid) {
  const pill = document.getElementById('pill_' + CSS.escape(uid));
  if (pill) {
    pill.className = 'user-pill inactive';
    setTimeout(() => pill.remove(), 2000);
  }
}

// ─────────────────────────────────────────────────────────────
//  Run Code
// ─────────────────────────────────────────────────────────────
const runBtn = document.getElementById('runBtn');
runBtn.addEventListener('click', runCode);

function runCode() {
  if (isRunning) return;
  send({ type: 'run_code' });
}

function setRunning(running, whoId) {
  isRunning = running;
  runBtn.disabled = running;
  document.getElementById('spinner').classList.toggle('active', running);

  const whoName = whoId === getMyId() ? 'คุณ' : whoId;
  if (running) {
    document.getElementById('runStatus').textContent = `${whoName} กำลังรัน...`;
    document.getElementById('exitBadge').style.display = 'none';
    addLog(`▶ ${whoName} กดรันโค้ด`, '#fbbf24');
  } else {
    document.getElementById('runStatus').textContent = 'พร้อมรัน';
  }
}

function showOutput(stdout, stderr, exitCode) {
  const preOut = document.getElementById('pre-stdout');
  const preErr = document.getElementById('pre-stderr');

  if (stdout) {
    preOut.textContent = stdout;
    preOut.className = 'output-pre stdout';
  } else {
    preOut.textContent = '// ไม่มี output';
    preOut.className = 'output-pre empty';
  }

  if (stderr) {
    preErr.textContent = stderr;
    preErr.className = 'output-pre stderr';
    switchTab('stderr');
  } else {
    preErr.textContent = '// ไม่มี error';
    preErr.className = 'output-pre empty';
    if (stdout) switchTab('stdout');
  }

  const badge = document.getElementById('exitBadge');
  badge.style.display = 'inline';
  badge.textContent = `exit ${exitCode}`;
  badge.className = 'exit-badge ' + (exitCode === 0 ? 'ok' : 'err');

  const icon = exitCode === 0 ? '✅' : '❌';
  addLog(`${icon} รันเสร็จ — exit code ${exitCode}`, exitCode === 0 ? '#4ade80' : '#f87171');
}

// ─────────────────────────────────────────────────────────────
//  Tabs
// ─────────────────────────────────────────────────────────────
document.querySelectorAll('.output-tab').forEach(tab => {
  tab.addEventListener('click', () => switchTab(tab.dataset.tab));
});

function switchTab(name) {
  document.querySelectorAll('.output-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.output-box').forEach(b =>
    b.classList.toggle('active', b.id === 'box-' + name));
}

// ─────────────────────────────────────────────────────────────
//  Log
// ─────────────────────────────────────────────────────────────
function addLog(msg, color = '#e2e8f0') {
  const list = document.getElementById('logList');
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  const now = new Date();
  const time = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  entry.innerHTML = `
    <span class="log-time">${time}</span>
    <span class="log-msg" style="color:${color}">${msg}</span>
  `;
  list.appendChild(entry);
  list.scrollTop = list.scrollHeight;
}

// ─────────────────────────────────────────────────────────────
//  UI Helpers
// ─────────────────────────────────────────────────────────────
function setConnected(ok) {
  const dot = document.getElementById('statusDot');
  const badge = document.getElementById('connBadge');
  dot.style.background = ok ? 'var(--success)' : '#f87171';
  dot.style.boxShadow = ok ? '0 0 6px var(--success)' : '0 0 6px #f87171';
  badge.textContent = ok ? 'ออนไลน์' : 'ออฟไลน์';
  badge.className = 'conn-badge ' + (ok ? 'connected' : 'disconnected');
}

// ─────────────────────────────────────────────────────────────
//  Init
// ─────────────────────────────────────────────────────────────
connect();
</script>
</body>
</html>
